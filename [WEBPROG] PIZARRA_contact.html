  <style>
    .contact-wrapper {
      display: flex;
      justify-content: center;
      align-items: center;
    }
    .contact-card-box {
      max-width: 480px;
      width: 100%;
      background: var(--white);
      border-radius: 16px;
      box-shadow: 0 10px 25px rgba(39, 55, 77, 0.15);
      overflow: hidden;
      border: 2px solid var(--light-blue);
      text-align: center;
    }
    .card-header-bg {
      background-color: var(--dark-navy);
      height: 110px;
      position: relative;
    }
    .card-photo {
      width: 130px;
      height: 130px;
      border-radius: 50%;
      border: 4px solid var(--white);
      object-fit: cover;
      margin-top: -65px;
      position: relative;
      background-color: var(--soft-ice);
    }
    .card-body {
      padding: 1.5rem 2rem 2.5rem 2.5rem;
    }
    .info-list {
      list-style: none;
      text-align: left;
      margin: 1.5rem 0;
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }
    .info-item {
      display: flex;
      align-items: center;
      gap: 1rem;
      word-break: break-all;
    }
    .info-icon {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background-color: var(--soft-ice);
      color: var(--dark-navy);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.1rem;
      flex-shrink: 0;
    }
  </style>
